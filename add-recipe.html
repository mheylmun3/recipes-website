<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Recipe</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/logo2.png" />
  <link rel="apple-touch-icon" href="images/logo2.png" />
</head>
<body>
  <canvas id="fairy-canvas"></canvas>
  <div class="vine vine-left" aria-hidden="true"></div>

  <div class="vine vine-right" aria-hidden="true"></div>

  <div class="corner-palm-wrap corner-palm-wrap-left" aria-hidden="true">
    <img src="images/palm-leaf.png" alt="" class="corner-palm-img corner-palm-img-left" />
  </div>

  <div class="corner-palm-wrap corner-palm-wrap-right" aria-hidden="true">
    <img src="images/palm-leaf.png" alt="" class="corner-palm-img corner-palm-img-right" />
  </div>


  <header>
    <nav class="navbar">
      <h1 class="nav-logo">
        <a href="index.html">
          <img src="images/logo3.png" alt="Gab's Italian Kitchen" />
        </a>
      </h1>

      <button
        class="hamburger"
        id="hamburgerBtn"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="mobileNav"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links" id="desktopNav">
        <li><a href="all-recipes.html">All Recipes</a></li>
        <li><a href="add-recipe.html">Add Recipe</a></li>
        <li><a href="meal-plan.html">Meal Plan</a></li>
        <li><a href="inventory.html">Inventory</a></li>
        <li><a href="grocery-list.html">Grocery List</a></li>
        <li><a href="macro-tracker.html">Macros</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>

    <div class="mobile-nav" id="mobileNav">
      <a href="all-recipes.html">All Recipes</a>
      <a href="add-recipe.html">Add Recipe</a>
      <a href="meal-plan.html">Meal Plan</a>
      <a href="inventory.html">Inventory</a>
      <a href="grocery-list.html">Grocery List</a>
      <a href="macro-tracker.html">Macros</a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <main class="form-page">
    <section class="form-card">
      <h2>Add a New Recipe</h2>

      <form id="addRecipeForm">
        <label for="recipeName">Recipe Name</label>
        <input type="text" id="recipeName" required />

        <label for="recipeCategory">Category</label>
        <select id="recipeCategory" required>
          <option value="">Select a category</option>
          <option value="breakfast">Breakfast</option>
          <option value="soups">Soups</option>
          <option value="crockpot-meals">Crockpot Meals</option>
          <option value="stove">Stove Meals</option>
          <option value="side-dishes">Side Dishes</option>
          <option value="sweet-treats">Sweet Treats</option>
        </select>

        <label for="recipeServings">Servings</label>
        <input
        type="number"
        id="recipeServings"
        min="1"
        step="1"
        placeholder="Enter number of servings"
        required
        />

        <div class="inventory-form-row">
          <div class="inventory-form-field">
            <label for="recipeCalories">Calories</label>
            <input
              type="number"
              id="recipeCalories"
              step="any"
              min="0"
              placeholder="Per serving"
            />
          </div>

          <div class="inventory-form-field">
            <label for="recipeProtein">Protein (g)</label>
            <input
              type="number"
              id="recipeProtein"
              step="any"
              min="0"
              placeholder="Per serving"
            />
          </div>

          <div class="inventory-form-field">
            <label for="recipeFiber">Fiber (g)</label>
            <input
              type="number"
              id="recipeFiber"
              step="any"
              min="0"
              placeholder="Per serving"
            />
          </div>
        </div>

        <label for="recipeImage">Recipe Image</label>
        <input
          type="file"
          id="recipeImage"
          accept="image/*"
        />

        <img id="recipeImagePreview" alt="Recipe preview" style="display: none; max-width: 260px; border-radius: 18px; margin-top: 0.75rem;" />

        <div class="recipe-section">
          <h3>Ingredients</h3>
          <div id="addIngredientsList" class="inventory-list"></div>
        </div>

        <button type="button" id="addIngredientRowBtn">Add Ingredient Row</button>

        <label for="recipeInstructions">Instructions</label>
        <textarea id="recipeInstructions" rows="8" required></textarea>

        <button type="submit">Save Recipe</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gab's Italian Kitchen</p>
  </footer>

  <div id="authRequiredModal" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal auth-message-modal">
      <h3>Please Login</h3>
      <p id="authRequiredMessage">Please login to add or change any recipes.</p>
      <div class="custom-modal-actions">
        <button type="button" id="closeAuthRequiredBtn">Close</button>
        <button type="button" id="goToLoginBtn">Go to Login</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="supabase-db.js"></script>
  <script src="auth-guard.js"></script>
  <script src="ingredients.js"></script>
  <script src="add-recipe.js"></script>
  <script src="background.js"></script>
  <script src="nav-scroll.js"></script>
  <script src="nav-menu.js"></script>
</body>
</html>
