<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe Details</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="fairy-canvas"></canvas>
  <div class="vine vine-left" aria-hidden="true"></div>
  <div class="vine vine-right" aria-hidden="true"></div>

  <header>
    <nav class="navbar">
      <h1><a href="index.html">My Recipes</a></h1>
      <ul>
        <li><a href="all-recipes.html">All Recipes</a></li>
        <li><a href="add-recipe.html">Add Recipe</a></li>
        <li><a href="inventory.html">Inventory</a></li>
        <li><a href="meal-plan.html">Meal Plan</a></li>
        <li><a href="grocery-list.html">Grocery List</a></li>
      </ul>
    </nav>
  </header>

  <main class="recipe-page">
    <section class="recipe-detail-card">

      <div class="recipe-page-actions">
      <a href="all-recipes.html">← Back to All Recipes</a>
      <a id="editRecipeLink" href="#">Edit Recipe</a>
      </div>

      <h2 id="recipeTitle">Loading...</h2>
      <p id="recipeServings"></p>
      <img id="recipeImageDisplay" alt="Recipe image" style="display: none; max-width: 320px; width: 100%; border-radius: 20px; margin-bottom: 1rem;" />

      <div class="recipe-section">
        <h3>Ingredients</h3>
        <ul id="ingredientsList"></ul>
      </div>

      <div class="recipe-section">
        <h3>Instructions</h3>
        <p id="instructionsText"></p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gab's Recipes</p>
  </footer>

  <script src="recipe.js"></script>
  <script src="background.js"></script>
</body>
</html>
