<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grocery List</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/logo2.png" />
  <link rel="apple-touch-icon" href="images/logo2.png" />
</head>
<body>
  <canvas id="fairy-canvas"></canvas>
  <div class="vine vine-left" aria-hidden="true"></div>

  <div class="vine vine-right" aria-hidden="true"></div>

  <div class="corner-palm-wrap corner-palm-wrap-left" aria-hidden="true">
    <img src="images/palm-leaf.png" alt="" class="corner-palm-img corner-palm-img-left" />
  </div>

  <div class="corner-palm-wrap corner-palm-wrap-right" aria-hidden="true">
    <img src="images/palm-leaf.png" alt="" class="corner-palm-img corner-palm-img-right" />
  </div>

  <header>
    <nav class="navbar">
      <h1 class="nav-logo">
        <a href="index.html">
          <img src="images/logo3.png" alt="Gab's Italian Kitchen" />
        </a>
      </h1>

      <button
        class="hamburger"
        id="hamburgerBtn"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="mobileNav"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links" id="desktopNav">
        <li><a href="all-recipes.html">All Recipes</a></li>
        <li><a href="add-recipe.html">Add Recipe</a></li>
        <li><a href="meal-plan.html">Meal Plan</a></li>
        <li><a href="inventory.html">Inventory</a></li>
        <li><a href="grocery-list.html">Grocery List</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>

    <div class="mobile-nav" id="mobileNav">
      <a href="all-recipes.html">All Recipes</a>
      <a href="add-recipe.html">Add Recipe</a>
      <a href="meal-plan.html">Meal Plan</a>
      <a href="inventory.html">Inventory</a>
      <a href="grocery-list.html">Grocery List</a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <main class="grocery-list-page">
    <section class="grocery-list-card">
      <h2>Grocery List</h2>
      <p>Generated from your current meal plan and inventory.</p>

      <section class="grocery-manual-add" data-requires-auth="true">
      <h3>Add Household or Extra Items</h3>

      <div class="meal-plan-add">
        <div class="ingredient-search-wrapper">
        <input
            type="text"
            id="grocerySearchInput"
            placeholder="Search item to add"
            autocomplete="off"
        />
        <div id="grocerySuggestions" class="suggestions-list"></div>
        </div>

        <button type="button" id="addManualGroceryBtn">Add to Grocery List</button>
      </div>

      <div class="inventory-form-row">
        <div>
        <label for="groceryQuantity">Quantity</label>
        <input
            type="number"
            id="groceryQuantity"
            min="0"
            step="1"
            placeholder="Enter quantity"
        />
        </div>

        <div>
        <label for="groceryUnit">Unit</label>
        <select id="groceryUnit">
            <option value="count">Count</option>
            <option value="tsp">tsp</option>
            <option value="tbsp">tbsp</option>
            <option value="cups">Cups</option>
            <option value="oz">oz</option>
            <option value="lbs">lbs</option>
            <option value="ml">mL</option>
            <option value="liters">Liters</option>
            <option value="gallon">Gallon</option>
            <option value="cans">Cans</option>
            <option value="jars">Jars</option>
            <option value="cloves">Cloves</option>
            <option value="box">Box</option>
            <option value="bag">Bag</option>
            <option value="stick">Stick</option>
            <option value="pint">Pint</option>
            <option value="container">Container</option>
        </select>
        </div>
      </div>

      <div class="inventory-actions">
        <button type="button" id="addNewManualItemBtn">Add New Item Name</button>
      </div>
    </section>

    <div id="groceryListContainer" class="inventory-list"></div>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gab's Italian Kitchen</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="supabase-db.js"></script>
  <script src="auth-guard.js"></script>
  <script src="grocery-list.js"></script>
  <script src="background.js"></script>
  <script src="nav-scroll.js"></script>
  <script src="nav-menu.js"></script>
</body>
</html>
