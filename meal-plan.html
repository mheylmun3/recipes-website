<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Plan</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="fairy-canvas"></canvas>
  <div class="vine vine-left" aria-hidden="true"></div>
  <div class="vine vine-right" aria-hidden="true"></div>

  <header>
    <nav class="navbar">
      <h1><a href="index.html">My Recipes</a></h1>
      <ul>
        <li><a href="all-recipes.html">All Recipes</a></li>
        <li><a href="add-recipe.html">Add Recipe</a></li>
        <li><a href="inventory.html">Inventory</a></li>
        <li><a href="meal-plan.html">Meal Plan</a></li>
        <li><a href="grocery-list.html">Grocery List</a></li>
      </ul>
    </nav>
  </header>

  <main class="meal-plan-page">
    <section class="meal-plan-card">
      <h2>Weekly Meal Plan</h2>

      <div class="meal-plan-add">
        <div class="ingredient-search-wrapper">
          <input
            type="text"
            id="recipeSearchInput"
            placeholder="Search recipe to add"
            autocomplete="off"
          />
          <div id="recipeSuggestions" class="suggestions-list"></div>
        </div>

        <button type="button" id="addRecipeToPlanBtn">Add to Meal Plan</button>
      </div>

      <section class="meal-plan-list-section">
        <h3>Planned Recipes</h3>
        <div id="mealPlanList" class="inventory-list"></div>
      </section>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gab's Recipes</p>
  </footer>

  <script src="meal-plan.js"></script>
  <script src="background.js"></script>
</body>
</html>
